<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Private Kurionyx team sign in.">
  <meta name="theme-color" content="#142033">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kurionyx">
  <title>Team sign in — Kurionyx</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('kurionyx-theme')||'original'}catch{document.documentElement.dataset.theme='original'}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/kurionyx-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/kurionyx-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <div class="login-smoke" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main class="login-shell login-shell-minimal">
    <section class="login-brand-panel login-brand-minimal">
      <a class="login-wordmark-link" href="index.html" aria-label="Kurionyx home"><img class="kurionyx-wordmark login-wordmark" src="assets/branding/kurionyx-wordmark-transparent.png" alt="Kurionyx"></a>
    </section>

    <section class="login-form-panel">
      <div class="auth-card login-card">
        <h2>Sign in</h2>
        <form id="login-form">
          <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Your password"></label>
          <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
          <button class="button primary full" type="submit">Continue</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="auth.js"></script>
  <script type="module" src="pwa.js"></script>
</body>
</html>
